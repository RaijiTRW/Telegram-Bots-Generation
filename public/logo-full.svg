<svg viewBox="0 0 100 100" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plane-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#24A1DE" stop-color="#24A1DE" stop-opacity="0.9" />
      <stop offset="50%" stopColor="#8B5CF6" stop-color="#8B5CF6" stop-opacity="0.7" />
      <stop offset="100%" stopColor="#1E8FB8" stop-color="#1E8FB8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="plane-wing-left" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#FFFFFF" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stopColor="#24A1DE" stop-color="#24A1DE" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="plane-wing-right" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#8B5CF6" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stopColor="#FFFFFF" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="wave-bottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#24A1DE" stop-color="#24A1DE" stop-opacity="0.1" />
      <stop offset="50%" stopColor="#8B5CF6" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stopColor="#24A1DE" stop-color="#24A1DE" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="wave-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8B5CF6" stop-color="#8B5CF6" stop-opacity="0.1" />
      <stop offset="50%" stopColor="#00F0FF" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="100%" stopColor="#8B5CF6" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Centering group -->
  <g transform="translate(2.5, 25)">
    <!-- BACKGROUND: Neural Network -->
    <g opacity="0.4">
      <path d="M10 25 L35 15 L50 35 L75 20 M35 15 L55 5 M50 35 L70 45" stroke="url(#plane-wing-left)" stroke-width="0.5" fill="none" />
      <circle cx="10" cy="25" r="1.5" fill="#00F0FF" filter="url(#subtle-glow)" />
      <circle cx="35" cy="15" r="1.5" fill="#00F0FF" filter="url(#subtle-glow)" />
      <circle cx="50" cy="35" r="1.5" fill="#00F0FF" filter="url(#subtle-glow)" />
      <circle cx="55" cy="5" r="1.5" fill="#00F0FF" filter="url(#subtle-glow)" />
      <circle cx="75" cy="20" r="1.5" fill="#00F0FF" filter="url(#subtle-glow)" />
      <circle cx="70" cy="45" r="1.5" fill="#00F0FF" filter="url(#subtle-glow)" />
    </g>

    <!-- MIDGROUND: Flow Waves -->
    <g>
      <path d="M0 30 Q 20 15, 45 28 T 90 25" stroke="url(#wave-bottom)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#subtle-glow)" />
      <path d="M15 35 Q 35 45, 55 30 T 95 32" stroke="url(#wave-top)" stroke-width="1.5" fill="none" stroke-linecap="round" filter="url(#neon-glow)" />
    </g>

    <!-- FOREGROUND: Paper Plane -->
    <g>
      <path d="M10 28 L35 15 L32 40 Z" fill="#000000" fill-opacity="0.4" filter="blur(4px)" />
      <path d="M12 24 L38 12 L30 35 Z" fill="url(#plane-wing-right)" stroke="#8B5CF6" stroke-opacity="0.8" stroke-width="0.5" stroke-linejoin="round" />
      <path d="M10 25 L40 10 L28 38 L22 28 Z" fill="url(#plane-body-grad)" stroke="#00F0FF" stroke-width="1" stroke-linejoin="round" filter="url(#neon-glow)" />
      <path d="M10 25 L40 10 L22 28 Z" fill="url(#plane-wing-left)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="0.75" stroke-linejoin="round" />
      <path d="M10 25 L40 10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" filter="url(#subtle-glow)" />
      <circle cx="10" cy="25" r="2" fill="#00F0FF" filter="url(#neon-glow)" />
    </g>
  </g>
</svg>
